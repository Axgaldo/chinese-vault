<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rueda dentada del refugio (puerta Vault-Tec) -->
  <g fill="#3dff70">
    <rect x="29" y="1.5" width="6" height="10" rx="1.5"/>
    <rect x="29" y="1.5" width="6" height="10" rx="1.5" transform="rotate(30 32 32)"/>
    <rect x="29" y="1.5" width="6" height="10" rx="1.5" transform="rotate(60 32 32)"/>
    <rect x="29" y="1.5" width="6" height="10" rx="1.5" transform="rotate(90 32 32)"/>
    <rect x="29" y="1.5" width="6" height="10" rx="1.5" transform="rotate(120 32 32)"/>
    <rect x="29" y="1.5" width="6" height="10" rx="1.5" transform="rotate(150 32 32)"/>
    <rect x="29" y="1.5" width="6" height="10" rx="1.5" transform="rotate(180 32 32)"/>
    <rect x="29" y="1.5" width="6" height="10" rx="1.5" transform="rotate(210 32 32)"/>
    <rect x="29" y="1.5" width="6" height="10" rx="1.5" transform="rotate(240 32 32)"/>
    <rect x="29" y="1.5" width="6" height="10" rx="1.5" transform="rotate(270 32 32)"/>
    <rect x="29" y="1.5" width="6" height="10" rx="1.5" transform="rotate(300 32 32)"/>
    <rect x="29" y="1.5" width="6" height="10" rx="1.5" transform="rotate(330 32 32)"/>
  </g>
  <!-- Anillo del mecanismo -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#3dff70" stroke-width="5"/>
  <!-- Marcas del dial -->
  <g stroke="#1d7a38" stroke-width="2">
    <line x1="32" y1="11" x2="32" y2="15"/>
    <line x1="32" y1="49" x2="32" y2="53"/>
    <line x1="11" y1="32" x2="15" y2="32"/>
    <line x1="49" y1="32" x2="53" y2="32"/>
  </g>
  <!-- Pantalla del terminal -->
  <circle cx="32" cy="32" r="19" fill="#030804" stroke="#1d7a38" stroke-width="1.5"/>
  <text x="32" y="40.5" font-size="24" text-anchor="middle" fill="#3dff70" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-weight="700">中</text>
</svg>
