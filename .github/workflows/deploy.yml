# Deploy a GitHub Pages — se dispara en cada push a main.
# Compila, REGENERA los MP3 del curso (no están en el repo) y publica dist/.
#
# IMPORTANTE (una sola vez): repo → Settings → Pages → Source = "GitHub Actions".
#
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Firebase: el .env no vive en el repo — se inyecta desde el secret FIREBASE_ENV
      # (Settings → Secrets and variables → Actions). Si el secret está vacío,
      # la app se compila en modo local sin romper el deploy.
      - name: Escribir .env de Firebase (desde secrets)
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
        run: echo "$FIREBASE_ENV" > .env

      - name: Tests (vitest)
        run: npm run test

      - name: Generar audio del curso (MP3 no viven en Git)
        run: npm run audio

      - name: Generar iconos PNG (rueda dentada del refugio)
        run: npm run icons

      - name: Compilar para Pages (base /chinese-vault/)
        run: npm run build:pages

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
